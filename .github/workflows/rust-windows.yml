name: Rust Windows
on:
  push:
    branches: ['main']
    tags: ['v*-windows-preview.*']
    paths: ['rust/**', '.github/workflows/rust-windows.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-windows.yml']
  workflow_dispatch:
    inputs:
      quick_ui:
        description: Build debug apps for fast native UI feedback; never publishes a release
        type: boolean
        default: false
      audit_languages:
        description: Verify the twenty interface languages on a compatible build
        type: boolean
        default: false
      audit_only:
        description: Run native GUI audits against the current Windows preview
        type: boolean
        default: false
      audit_run_id:
        description: Optional build run ID for native audits; empty audits the public preview
        type: string
        default: ''
      audit_pictures:
        description: Include spreadsheet picture UI checks on a compatible build artifact
        type: boolean
        default: false
      audit_technical:
        description: Include technical object insertion and editing checks on a compatible build artifact
        type: boolean
        default: false
      audit_labels:
        description: Include DOC table labels and remembered label settings on a compatible build
        type: boolean
        default: false
jobs:
  windows:
    if: inputs.audit_only != true
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache/restore@v4
        if: inputs.quick_ui == true
        id: debug-cache
        with:
          path: |
            ~/.cargo/registry
            rust/target/debug
          key: windows-native-debug-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-native-debug-${{ hashFiles('rust/Cargo.lock') }}-
      - name: Provision pinned PDFium for file-engine tests
        if: inputs.quick_ui != true
        shell: pwsh
        run: |
          python scripts/fetch-pdfium.py build/test-pdfium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force target/debug/deps | Out-Null
          Copy-Item build/test-pdfium/pdfium.dll target/debug/deps/pdfium.dll
      - run: cargo test --locked --workspace
        if: inputs.quick_ui != true
      - name: Build six native executables
        id: build
        shell: pwsh
        env:
          QUICK_UI: ${{ inputs.quick_ui }}
        run: |
          if ($env:QUICK_UI -eq 'true') {
            cargo build --locked -p img42 -p doc42 -p xls42 -p ppt42 -p pdf42 -p scn42
            exit $LASTEXITCODE
          }
          Push-Location scripts
          rc.exe /fo windows-app.res windows-app.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $env:RUSTFLAGS = "-C link-arg=$((Resolve-Path scripts/windows-app.res).Path)"
          cargo build --locked --release -p img42 -p doc42 -p xls42 -p ppt42 -p pdf42 -p scn42
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage PDFium runtime and licenses
        shell: pwsh
        env:
          QUICK_UI: ${{ inputs.quick_ui }}
        run: |
          $profile = if ($env:QUICK_UI -eq 'true') { 'debug' } else { 'release' }
          New-Item -ItemType Directory -Force build/off42 | Out-Null
          python scripts/fetch-pdfium.py build/off42
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($app in @('img42','doc42','xls42','ppt42','pdf42','scn42')) {
            Copy-Item "target/$profile/$app.exe" "build/off42/$($app.ToUpper()).exe"
          }
          cargo metadata --locked --format-version 1 --filter-platform x86_64-pc-windows-msvc | Out-File -Encoding utf8 build/metadata.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/collect-licenses.py build/metadata.json build/off42/licenses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $rustLicenses = Join-Path (rustc --print sysroot) 'share/doc/rust/licenses'
          if (Test-Path $rustLicenses) { Copy-Item -Recurse $rustLicenses build/off42/licenses/rust-toolchain }
          Copy-Item ../LICENSE build/off42/licenses/off42-LICENSE
          Copy-Item crates/doc42-layout-probe/fixtures/OFL.txt build/off42/licenses/NotoSans-OFL.txt
          "Commit: $env:GITHUB_SHA`nProfile: $profile`nWorkflow: $env:GITHUB_RUN_ID" | Out-File -Encoding utf8 build/off42/BUILD-IDENTITY.txt
          Compress-Archive -Path build/off42 -DestinationPath build/Suite42-windows-x64.zip
      - name: Audit native commands in the packaged apps
        run: python scripts/audit-ui-windows.py --bin-dir build/off42 --output build/native-ui --extended --pictures --technical-objects --label-sources --languages --recents
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-ui-built
          path: rust/build/native-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Suite42-windows-x64
          path: rust/build/Suite42-windows-x64.zip

      - uses: actions/cache/save@v4
        if: always() && inputs.quick_ui == true && steps.build.outcome == 'success' && steps.debug-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            rust/target/debug
          key: windows-native-debug-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}

  publish-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-windows-preview.')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Suite42-windows-x64
      - name: Publish the tested ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          asset="off42-${TAG#v}-x64.zip"
          mv Suite42-windows-x64.zip "$asset"
          unzip -tq "$asset"
          digest=$(sha256sum "$asset" | cut -d' ' -f1)
          cat > release-notes.md <<EOF
          Windows x64 preview of off42 with PDF42, DOC42, XLS42, IMG42, PPT42 and SCN42.

          PDF42, DOC42 and XLS42 can export A4 label sheets and PNG barcodes in four formats.
          XLS42 can fill serial numbers with leading zeroes. PDF42, DOC42 and PPT42 share a local signature and stamp library.

          Extract the entire ZIP and run the app you want. Keep \`pdfium.dll\` alongside \`PDF42.exe\`.
          The executables are unsigned. If Windows reports a missing Visual C++ runtime, install the
          [Microsoft Visual C++ Redistributable for x64](https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist/).

          [Windows build and automated tests]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID) · [Features and limits]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/rust/README.md)

          SHA-256 \`$digest\`
          EOF
          gh release create "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "off42 ${TAG#v} (x64)" --notes-file release-notes.md

  native-ui:
    if: inputs.audit_only == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the current Windows preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
        run: |
          if ($env:AUDIT_RUN_ID) {
            gh run download $env:AUDIT_RUN_ID --repo $env:GITHUB_REPOSITORY --name Suite42-windows-x64 --dir build
          } else {
            gh release download v1.0.0-windows-preview.3 --repo $env:GITHUB_REPOSITORY --pattern '*-x64.zip' --dir build
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive build/*.zip -DestinationPath build/preview
      - name: Audit native commands and generated files
        env:
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
          AUDIT_PICTURES: ${{ inputs.audit_pictures }}
          AUDIT_TECHNICAL: ${{ inputs.audit_technical }}
          AUDIT_LABELS: ${{ inputs.audit_labels }}
          AUDIT_LANGUAGES: ${{ inputs.audit_languages }}
        shell: pwsh
        run: |
          $extra = @()
          if ($env:AUDIT_RUN_ID) { $extra += '--extended' }
          if ($env:AUDIT_PICTURES -eq 'true') { $extra += '--pictures' }
          if ($env:AUDIT_TECHNICAL -eq 'true') { $extra += '--technical-objects' }
          if ($env:AUDIT_LABELS -eq 'true') { $extra += '--label-sources' }
          if ($env:AUDIT_LANGUAGES -eq 'true') { $extra += '--languages' }
          python rust/scripts/audit-ui-windows.py --bin-dir build/preview/off42 --output build/native-ui @extra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-ui
          path: build/native-ui
