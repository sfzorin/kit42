name: Rust Windows
on:
  push:
    paths: ['rust/**', '.github/workflows/rust-windows.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-windows.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cargo test --locked --workspace
      - name: Build six native executables with Windows visual styles
        shell: pwsh
        run: |
          Push-Location scripts
          rc.exe /fo windows-app.res windows-app.rc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          $env:RUSTFLAGS = "-C link-arg=$((Resolve-Path scripts/windows-app.res).Path)"
          cargo build --locked --release -p img42 -p doc42 -p xls42 -p ppt42 -p pdf42 -p scn42
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
