[package]
name = "img42-core"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif", "webp"] }
kamadak-exif = "0.6"
tiff = "0.11"
gif = "0.14"
image-webp = "0.2"
cosmic-text = "0.14"
crc32fast = "1"
tempfile = "3"
