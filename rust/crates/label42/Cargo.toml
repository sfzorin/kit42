[package]
name = "label42"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
resvg = "=0.45.1"
ttf-parser = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
datamatrix = "0.3.3"
png = "0.18"
lopdf = "0.47"
rxing = { version = "0.9.3", default-features = false, features = ["encoders", "encoding_rs", "aztec", "datamatrix", "oned", "qrcode"] }
suite42-pdf-text = { path = "../suite42-pdf-text" }

[dev-dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["decoders"] }
