[package]
name = "img42"
version = "0.1.0"
edition = "2021"

[dependencies]
suite42-core = { path = "../../crates/suite42-core" }
suite42-pdf-raster = { path = "../../crates/suite42-pdf-raster" }
win42 = { path = "../../crates/win42" }
img42-core = { path = "../../crates/img42-core" }
image = { version = "0.25", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
