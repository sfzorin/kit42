img42-core = { path = "../../crates/img42-core" }

tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Devices_ImageAcquisition", "Win32_Foundation", "Win32_System_Com", "Win32_Graphics_Imaging"] }
